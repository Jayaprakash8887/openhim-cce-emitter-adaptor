# Integration test profile — WireMock replaces Collector, heartbeat disabled
server:
  port: 0  # random port for tests

spring:
  application:
    name: cce-emitter-adaptor
  main:
    allow-bean-definition-overriding: true

mediator:
  urn: "urn:mediator:cce-emitter-adaptor"
  version: "1.0.0"
  name: "CCE Emitter Adaptor"
  endpoint:
    host: localhost
    path: /inbound
    type: http

openhim:
  core:
    host: localhost
    api-port: 18080
    username: root@openhim.org
    password: openhim-password
  heartbeat:
    enabled: false

cce:
  collector:
    url: http://localhost:${wiremock.server.port:5055}
    events-path: /v1/events
    timeout: 3000
    retry:
      max-attempts: 3
      backoff-ms: 100
    auth:
      token: test-token
  emitter:
    patient-identifier-system: "http://openphc.org/identifier/upid"
    sources:
      ebuzima:
        client-id: ebuzima-emr-client

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: cce-emitter-adaptor

logging:
  level:
    org.openphc.cce: DEBUG
    org.springframework.web: DEBUG
