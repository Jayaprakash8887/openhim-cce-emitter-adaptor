# Development profile — heartbeat disabled, DEBUG logging, local URLs
server:
  port: 8082

mediator:
  urn: "urn:mediator:cce-emitter-adaptor"
  version: "1.0.0"
  name: "CCE Emitter Adaptor"
  endpoint:
    host: localhost
    path: /inbound
    type: http

openhim:
  core:
    host: localhost
    api-port: 8080
    username: root@openhim.org
    password: openhim-password
  heartbeat:
    enabled: false

cce:
  collector:
    url: http://localhost:5001
    events-path: /v1/events
    timeout: 5000
    retry:
      max-attempts: 3
      backoff-ms: 1000
    auth:
      token: dev-token
  emitter:
    patient-identifier-system: "http://openphc.org/identifier/upid"
    facility-filter:
      ids: ["0234", "abc-123"]   # empty = filter inactive; add IDs to restrict (e.g. ["1302", "0030"])
    sources:
      ebuzima:
        client-id: ebuzima-emr-client
      spice:
        client-id: spice-fhir-client
      openmrs:
        client-id: openmrs-fhir-client

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: cce-emitter-adaptor

logging:
  level:
    org.openphc.cce: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
