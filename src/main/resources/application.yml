server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: cce-emitter-adaptor

# Mediator Identity & Endpoint
mediator:
  urn: "urn:mediator:cce-emitter-adaptor"
  version: "1.0.0"
  name: "CCE Emitter Adaptor"
  endpoint:
    host: localhost
    path: /inbound
    type: http

# OpenHIM Core Configuration
openhim:
  core:
    host: localhost
    api-port: 8080
    scheme: https
    auth-type: basic
    username: root@openhim.org
    password: 123456
  heartbeat:
    enabled: true
    interval-seconds: 10

# CCE Collector Configuration
cce:
  collector:
    url: http://localhost:5001
    events-path: /v1/events
    timeout: 5000
    retry:
      max-attempts: 3
      backoff-ms: 1000
    auth:
      token: local-dev-token
      keycloak-host:
      realm:
      client-id:
      client-secret:
  emitter:
    patient-identifier-system: "http://openphc.org/identifier/upid"
    redaction:
      # Clinical-data minimisation. CCE records THAT a clinical step happened — never
      # WHAT the finding was. Rules are per resourceType because the same element differs
      # in sensitivity: `code` is the diagnosis on Condition but the observation TYPE on
      # Observation (which protocol triggers match on, so it is kept there).
      # Full rationale: docs/data-dictionary.md §3.6
      enabled: true
      # Nested paths applied to EVERY resource type. Patient name only — subject.reference /
      # patient.reference (the UPID) are preserved, since that is how CCE keys the patient.
      # Type-specific nested content belongs on the rule below, not here.
      #
      # Path syntax: dot-delimited, and a segment ending in `[]` steps through an array and
      # applies to every element, e.g. `reaction[].manifestation`. The `[]` is REQUIRED where
      # the data is an array; without it the path matches nothing. That is not silent —
      # the adaptor logs a warning and increments cce.emitter.redaction.path.mismatch.total.
      remove-paths: [subject.display, patient.display]
      rules:
        # code KEPT — it is the observation TYPE (LOINC) and protocol triggers match on it
        - resource-type: Observation
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            component
        # type/class/serviceType/hospitalization/location KEPT — drive matching + referral KPI
        # hospitalization is kept for facility attribution (hospitalization.origin), so its
        # clinical child is stripped by a type-scoped path instead of a root field
        - resource-type: Encounter
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            diagnosis
          remove-paths: [hospitalization.dischargeDisposition]
        # code = the test ordered; category KEPT (identifies a laboratory order)
        - resource-type: ServiceRequest
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            code
        # the drug, quantity and refills; intent + authoredOn KEPT
        - resource-type: MedicationRequest
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            medicationCodeableConcept, medicationReference, dispenseRequest
        # code = the diagnosis; clinicalStatus/verificationStatus KEPT (trigger keys)
        - resource-type: Condition
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            code
        # the drug and amount; whenHandedOver KEPT (clinical time)
        - resource-type: MedicationDispense
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            medicationCodeableConcept, medicationReference, quantity
        # no clinical finding — category/scope/status are consent metadata and are KEPT
        - resource-type: Consent
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction
        # code = the procedure performed; performedDateTime/location KEPT
        - resource-type: Procedure
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            code, outcome, complication
        # the drug and amount given
        - resource-type: MedicationAdministration
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            medicationCodeableConcept, medicationReference, dosage, supportingInformation
        # code = the allergen
        - resource-type: AllergyIntolerance
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            code, reaction
        # the radiology findings (conclusion is free-text from the radiologist)
        - resource-type: ImagingStudy
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            conclusion, conclusionCode, description, procedureCode, series, modality
        # vaccineCode = the vaccine given. Not yet received — pre-declared
        - resource-type: Immunization
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction,
            vaccineCode
        # fallback for any type without its own rule; leaves code alone (may be structural)
        - resource-type: "*"
          fields: >-
            valueQuantity, valueCodeableConcept, valueString, valueBoolean, valueInteger, valueRange,
            valueRatio, valueSampledData, valueTime, valueDateTime, valuePeriod, valueAttachment, note, text,
            interpretation, dataAbsentReason, bodySite, method, specimen, referenceRange, contained, severity,
            stage, evidence, dosageInstruction, reasonCode, reasonReference, orderDetail, patientInstruction
    facility-filter:
      ids: []
    sources:
      ebuzima:
        client-id: ebuzima-emr-client
      spice:
        client-id: spice-fhir-client
      openmrs:
        client-id: openmrs-fhir-client

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: cce-emitter-adaptor

# Logging
logging:
  level:
    org.openphc.cce: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
